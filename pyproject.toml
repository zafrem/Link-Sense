[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link-sense"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
link-sense = "link_sense.cli:app"
link-sense-host = "link_sense.host:run"

[tool.hatch.build.targets.wheel]
packages = ["link_sense"]
